name: "Bug Report"
description: "Report a bug to help us improve the project"
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: description
    attributes:
      label: "Bug Description"
      description: "A clear and concise description of what the bug is."
      placeholder: "Tell us what happened..."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "Steps To Reproduce"
      description: "Steps to reproduce the behavior."
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected Behavior"
      description: "What did you expect to happen?"
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: "Screenshots / Logs"
      description: "If applicable, add screenshots or log output."
  - type: input
    id: version
    attributes:
      label: "Version"
      description: "Which version of the project are you running?"
      placeholder: "v1.0.0"
  - type: dropdown
    id: os
    attributes:
      label: "Operating System"
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: "Checklist"
      options:
        - label: "I have searched existing issues to avoid duplicates"
          required: true
        - label: "I am running the latest version"
